name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '12.*'
            testbench: '10.*'
            php: '8.3'
            name: 'Laravel 12'
          - laravel: '13.*'
            testbench: '11.*'
            php: '8.3'
            name: 'Laravel 13'

    name: ${{ matrix.name }} (PHP ${{ matrix.php }})

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Instalar dependencias (fija la versión de Laravel/Testbench de la matriz)
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update --dev
          composer update --prefer-dist --no-interaction --with-all-dependencies

      - name: Tests
        run: vendor/bin/phpunit --no-coverage
